name: Raven Scout

on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * *'
  pull_request:
    paths:
      - 'scripts/raven_scout.py'
      - 'config/raven_sources.json'
      - 'config/raven_scoring.json'
      - 'config/raven_strategies.json'
      - '.github/workflows/raven-scout.yml'

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: pip install requests beautifulsoup4
      - name: Run Raven Scout
        run: python scripts/raven_scout.py
      - name: Validate lead feed
        run: python -c "import json,pathlib; d=json.loads(pathlib.Path('data/leads.json').read_text()); assert isinstance(d.get('leads'),list); assert isinstance(d.get('health'),list); assert d.get('version')=='3.0'; print('validated',len(d['leads']),'leads across',len(d['health']),'sources')"
      - name: Commit updated lead feed
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "Raven Scout"
          git config user.email "actions@users.noreply.github.com"
          git add data/leads.json
          git diff --cached --quiet && exit 0
          git commit -m "update Raven lead feed"
          git push
