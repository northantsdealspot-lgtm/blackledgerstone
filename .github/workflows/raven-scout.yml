name: Raven Scout

on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * *'

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: pip install requests beautifulsoup4
      - name: Run Raven Scout
        run: python scripts/raven_scout.py
      - name: Commit updated lead feed
        run: |
          git config user.name "Raven Scout"
          git config user.email "actions@users.noreply.github.com"
          git add data/leads.json
          git diff --cached --quiet && exit 0
          git commit -m "update Raven lead feed"
          git push
