name: Raven Scout

on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * *'
  pull_request:
    paths:
      - 'scripts/raven_scout.py'
      - 'config/raven_sources.json'
      - 'config/raven_scoring.json'
      - '.github/workflows/raven-scout.yml'

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: pip install requests beautifulsoup4
      - name: Run Raven Scout
        run: python scripts/raven_scout.py
      - name: Validate lead feed
        run: python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/leads.json')
          data=json.loads(p.read_text())
          assert isinstance(data.get('leads'), list)
          assert isinstance(data.get('health'), list)
          assert data.get('version') == '3.0'
          print('validated', len(data['leads']), 'leads across', len(data['health']), 'sources')
          PY
      - name: Commit updated lead feed
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "Raven Scout"
          git config user.email "actions@users.noreply.github.com"
          git add data/leads.json
          git diff --cached --quiet && exit 0
          git commit -m "update Raven lead feed"
          git push
